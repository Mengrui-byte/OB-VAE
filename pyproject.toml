[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ob-vae"
version = "0.1.0"
description = "Full-window 256-minute order book VAE research baseline"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "torch>=2.1", "tqdm>=4.64"]

[project.scripts]
obvae = "obvae.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["obvae*", "model*", "train_dual*", "util*"]
namespaces = true

[tool.setuptools.data-files]
"share/ob-vae/weights" = ["weights/gelu512.pt", "weights/manifest.json"]
"share/ob-vae/research" = ["research/*.json", "research/*.npy", "research/original_runtime.tar.gz"]
