<svg xmlns="http://www.w3.org/2000/svg" width="850" height="630" viewBox="0 0 850 630" role="img" aria-label="峰特征V7/价格几何V8"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#41677d"/></marker></defs><rect width="100%" height="100%" fill="white"/><rect x="35" y="15" width="780" height="74" rx="10" fill="#e6f2f9" stroke="#a8c0cc"/><text x="425" y="44" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="600" fill="#183345">Observed book</text><text x="425" y="69" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#416278">256 x 2 x 2048 price/quantity</text><path d="M425,90 L425,113" stroke="#41677d" stroke-width="2" marker-end="url(#a)"/><rect x="35" y="115" width="780" height="74" rx="10" fill="#e9f4ef" stroke="#a8c0cc"/><text x="425" y="144" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="600" fill="#183345">Background + native peak descriptors</text><text x="425" y="169" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#416278">4 local peak slots; rank/price/quantity</text><path d="M425,190 L425,213" stroke="#41677d" stroke-width="2" marker-end="url(#a)"/><rect x="35" y="215" width="780" height="74" rx="10" fill="#fdf2d9" stroke="#a8c0cc"/><text x="425" y="244" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="600" fill="#183345">Alternating spatial / temporal encoder</text><text x="425" y="269" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#416278">price-aligned past feature cells</text><path d="M425,290 L425,313" stroke="#41677d" stroke-width="2" marker-end="url(#a)"/><rect x="35" y="315" width="780" height="74" rx="10" fill="#e6f2f9" stroke="#a8c0cc"/><text x="425" y="344" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="600" fill="#183345">Local-region bottleneck</text><text x="425" y="369" text-anchor="middle" font-family="sans-serif" font-size